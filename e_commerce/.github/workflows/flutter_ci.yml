name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Installer les dépendances
        run: flutter pub get

      - name: Analyser le code (flutter analyze)
        run: flutter analyze

      - name: Vérifier le formatage
        run: dart format --output=none --set-exit-if-changed .

      - name: Lancer les tests unitaires et widgets
        run: flutter test